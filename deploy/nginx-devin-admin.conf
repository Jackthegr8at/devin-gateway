# Install in sites-available and enable after the source-restricted firewall.
# Replace __GATEWAY_IP__ with the gateway's private IPv4 address.
map $http_origin $devin_admin_origin {
    default forbidden;
    "" "";
    "https://admin.example.test" "http://127.0.0.1:3001";
}
map $http_sec_fetch_site $devin_admin_site_allowed {
    default 0;
    "" 1;
    "same-origin" 1;
    "none" 1;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name admin.example.test;
    ssl_certificate /etc/letsencrypt/live/example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Cache-Control "no-store" always;
    allow 192.0.2.0/24;
    allow 198.51.100.0/24;
    deny all;
    satisfy all;
    auth_basic "Devin Gateway administration";
    auth_basic_user_file /etc/nginx/auth/devin-admin.htpasswd;

    # Validate before translating to the unchanged backend contract.
    if ($http_host != "admin.example.test") { return 403; }
    if ($devin_admin_origin = forbidden) { return 403; }
    if ($devin_admin_site_allowed = 0) { return 403; }

    location ~ ^/admin/(?:$|api/(?:models|model-selection|model-test-status|accounts)$|assets/(?:model-picker\.js|model-picker\.css|third-party-notices\.txt)$) {
        limit_except GET PUT { deny all; }
        proxy_pass http://__GATEWAY_IP__:38644;
        proxy_http_version 1.1;
        proxy_set_header Host "127.0.0.1:3001";
        proxy_set_header Origin $devin_admin_origin;
        # Browser-supplied copies are discarded. Nginx alone adds the per-install proxy secret (see the snippet).
        proxy_set_header X-Devin-Admin-Proxy "";
        include /etc/nginx/devin-admin-proxy-secret.conf;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Api-Key "";
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host "admin.example.test";
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 3s;
        proxy_send_timeout 15s;
        proxy_read_timeout 60s;
    }
    location / { return 404; }
}

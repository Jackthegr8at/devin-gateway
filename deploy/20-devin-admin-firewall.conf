# Example for the reviewed private deployment; adapt both IPv4 arguments.
# Install as /etc/systemd/system/docker.service.d/20-devin-admin-firewall.conf.
# Runs AFTER the existing 10-devhub-firewall.conf hook.
[Unit]
Requires=devin-admin-firewall.service
After=devin-admin-firewall.service

[Service]
ExecStartPost=/usr/local/sbin/devin-admin-firewall 192.168.0.214 192.168.0.199

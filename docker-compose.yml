services:
  devin-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DEVIN_GATEWAY_BIND_IP:?Set DEVIN_GATEWAY_BIND_IP in .env to a private devhub interface IP}:38643:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      DEVIN_CODEX_DESKTOP_COLLAPSE_SYSTEM: "1"
      DEVIN_RESPONSES_SAFE_DIAGNOSTICS: "${DEVIN_RESPONSES_SAFE_DIAGNOSTICS:-0}"
      DEVIN_RESPONSES_SAFE_DIAGNOSTICS_PATH: "/app/logs/responses-safe-diagnostic.jsonl"
      ERROR_TRACE: "false"
      LOG_LEVEL: "info"
      DEBUG: "false"
      LOG_FILE: "/app/logs/gateway.log"
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT:-3000}/health | grep -q '\"status\":\"ok\".*\"collapse_system_enabled\":true'"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
